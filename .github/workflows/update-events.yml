name: Update kalendar dogadjanja - svaka 4 sata

on:
  workflow_dispatch:
  schedule:
    - cron: "40 */4 * * *"
  push:
    branches:
      - main
    paths:
      - "update_events.py"
      - ".github/workflows/update-events.yml"

permissions:
  contents: write

env:
  TZ: Europe/Zagreb
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: portal-data-writes
  cancel-in-progress: false

jobs:
  update-events:
    name: Osvjezi javni kalendar dogadjanja
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azuriraj dogadjanja i status naslovnice
        shell: bash
        run: |
          set -euo pipefail
          echo "START EVENTS UPDATE: $(date -u)"
          python update_events.py
          python generate_home_data.py
          echo "END EVENTS UPDATE: $(date -u)"

      - name: Spremi promjene dogadjanja
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/events_calendar.json data/events_status.json data/home_events.json data/home_status.json data/source_quality.json data/home_news.json data/home_symbol.json
          if git diff --cached --quiet; then
            echo "Nema promjena događanja za commit."
            exit 0
          fi
          git commit -m "Automatsko azuriranje kalendara dogadjanja i statusa"
          git pull --rebase origin main
          git push origin HEAD:main
