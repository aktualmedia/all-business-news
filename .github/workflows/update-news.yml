name: Update vijesti - svaki sat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news.yml"
      - "update_news.py"
      - "postprocess_news.py"
      - "limit_news_archive.py"
      - "build_gallery_from_archive.py"
      - "update_gallery_groups.py"
      - "merge_global_extra_feeds.py"
      - "fill_symbol_quorum_en.py"
      - "fill_premium_categories.py"
      - "fill_core_business_science.py"
      - "fill_missing_core_categories.py"
      - "generate_home_data.py"
      - "generate_seo.py"
      - "portal_check.py"
      - "data/global_extra_feeds.json"
      - "data/ai_posts.json"
      - "data/editions.json"

permissions:
  contents: write

env:
  TZ: Europe/Zagreb
  PYTHONUNBUFFERED: "1"

concurrency:
  group: update-vijesti-main
  cancel-in-progress: true

jobs:
  update-news:
    name: Osvjezi sadrzaj i potvrdi integritet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generiraj vijesti i premium rubrike
        shell: bash
        run: |
          set -euo pipefail
          echo "START VIJESTI: $(date -u)"
          python merge_global_extra_feeds.py
          python update_news.py
          python fill_symbol_quorum_en.py
          python fill_premium_categories.py
          python fill_core_business_science.py
          python fill_missing_core_categories.py
          python limit_news_archive.py
          python build_gallery_from_archive.py
          python update_gallery_groups.py
          python generate_home_data.py
          python generate_seo.py
          python portal_check.py
          echo "END VIJESTI: $(date -u)"

      - name: Spremi potvrdene podatke
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/feeds.json data/news.json data/archive.json data/category_news data/category_counts.json data/generated_at.json data/source_stats.json data/source_quality.json data/manual_gallery.json data/gallery_status.json data/gallery_groups data/home_gallery_groups.json data/gallery_groups_status.json data/home_news.json data/home_symbol.json data/home_status.json data/automation_status.json data/seo_index.json sitemap.xml sitemap-news.xml sitemap-posts.xml sitemap-authors.xml sitemap-events.xml urllist.txt site.webmanifest llms.txt robots.txt
          if git diff --cached --quiet; then
            echo "Nema novih podataka za spremanje."
            exit 0
          fi
          git commit -m "Automatsko satno azuriranje vijesti i provjera integriteta"
          git pull --rebase origin main
          git push origin main
