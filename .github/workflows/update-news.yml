name: Update vijesti - svaki sat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news.yml"
      - "update_news.py"
      - "fast_update_news.py"
      - "fast_fill_categories.py"
      - "postprocess_news.py"
      - "limit_news_archive.py"
      - "build_gallery_from_archive.py"
      - "update_gallery_groups.py"
      - "merge_global_extra_feeds.py"
      - "fill_symbol_quorum_en.py"
      - "fill_premium_categories.py"
      - "fill_core_business_science.py"
      - "fill_missing_core_categories.py"
      - "generate_home_data.py"
      - "generate_seo.py"
      - "portal_check.py"
      - "data/global_extra_feeds.json"
      - "data/ai_posts.json"
      - "data/editions.json"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Europe/Zagreb
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: portal-data-writes
  cancel-in-progress: false

jobs:
  update-news:
    name: Osvjezi i odmah objavi osnovne vijesti
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provjeri sintaksu jezgre vijesti
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile merge_global_extra_feeds.py update_news.py fast_update_news.py

      - name: Dohvati osnovne vijesti
        shell: bash
        run: |
          set -euo pipefail
          echo "START CORE NEWS: $(date -u)"
          python merge_global_extra_feeds.py
          python fast_update_news.py
          echo "END CORE NEWS: $(date -u)"

      - name: Odmah spremi osnovne vijesti i status dohvata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/news.json data/archive.json data/category_news data/category_counts.json data/source_stats.json data/generated_at.json data/manual_gallery.json data/feeds.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::warning::Core dohvat nije proizveo promjene za objavu."
          else
            git commit -m "Automatska objava osnovnih vijesti i statusa dohvata"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Uskladi radnu kopiju nakon objave osnovnih vijesti
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Dopuni rubrike i portal bez blokiranja osnovnih vijesti
        shell: bash
        run: |
          set +e
          python -m py_compile fast_fill_categories.py postprocess_news.py limit_news_archive.py generate_home_data.py portal_check.py build_gallery_from_archive.py update_gallery_groups.py generate_seo.py
          if [ "$?" -ne 0 ]; then
            echo "::warning::Dopunska obrada ima sintaksnu pogresku; osnovne vijesti su vec objavljene."
            exit 0
          fi
          python fast_fill_categories.py || echo "::warning::Dopuna rubrika nije dovrsena."
          python postprocess_news.py || echo "::warning::Postproces nije dovrsen."
          python limit_news_archive.py || echo "::warning::Arhiva nije obradjena."
          python generate_home_data.py || echo "::warning::Naslovnica nije osvjezena."
          python portal_check.py || echo "::warning::Provjera integriteta prijavila je problem."
          python build_gallery_from_archive.py || echo "::warning::Galerija nije obnovljena."
          python update_gallery_groups.py || echo "::warning::Grupe galerije nisu obnovljene."
          python generate_seo.py || echo "::warning::SEO datoteke nisu obnovljene."
          python generate_home_data.py || echo "::warning::Zavrsno osvjezavanje naslovnice nije dovrseno."
          exit 0

      - name: Spremi dopunske podatke ako postoje
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data sitemap.xml sitemap-news.xml sitemap-posts.xml sitemap-authors.xml sitemap-events.xml urllist.txt site.webmanifest llms.txt robots.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nema dopunskih promjena."
            exit 0
          fi
          git commit -m "Automatska dopuna naslovnice galerije i SEO podataka"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy-pages:
    name: Objavi aktualne podatke na GitHub Pages
    needs: update-news
    runs-on: ubuntu-latest
    concurrency:
      group: web-vijesti-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Preuzmi aktualni main nakon azuriranja
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Konfiguriraj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pripremi portal za objavu
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Objavi aktualni portal
        id: deployment
        uses: actions/deploy-pages@v4
